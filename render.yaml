services:
  - type: web
    name: all-saver-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT main:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_USERNAME
        value: "@nrtecno2"
      - key: CHANNEL_URL
        value: "https://t.me/nrtecno2"
